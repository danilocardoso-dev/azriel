[package]
name = "azriel"
version = "0.8.4"
description = "Azriel Personal Intelligence System"
authors = ["Danilo"]
edition = "2021"
default-run = "azriel"

[lib]
name = "azriel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk", "network"] }
tauri-plugin-dialog = "2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tokio = { version = "1", features = ["time", "sync", "macros"] }
sha2 = "0.10"
infer = "0.19"
lopdf = "0.38"
tauri-plugin-opener = "2"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
flate2 = "1"
hmac = "0.12"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Graphics_Gdi"] }
